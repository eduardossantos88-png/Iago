<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha - Iago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }

        .container {
            background: #16213e;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
            max-width: 700px;
            width: 100%;
            border: 1px solid #0f3460;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e94560;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a8a8b3;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 14px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 0 #0a1a2e;
            letter-spacing: 1px;
            min-width: 140px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #0a1a2e;
            background: #1a4a7a;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #0a1a2e;
        }

        .btn-play {
            background: #e94560;
            box-shadow: 0 5px 0 #a52a3f;
        }

        .btn-play:hover {
            background: #ff5a7a;
            box-shadow: 0 8px 0 #a52a3f;
        }

        .btn-skins {
            background: #533483;
            box-shadow: 0 5px 0 #3a1f5c;
        }

        .btn-skins:hover {
            background: #6f4a9e;
            box-shadow: 0 8px 0 #3a1f5c;
        }

        .skin-selector {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 20px;
            margin: 15px 0;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 1px solid #533483;
        }

        .skin-selector.active {
            display: flex;
        }

        .skin-options {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .skin-option {
            background: #0f3460;
            border-radius: 16px;
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .skin-option:hover {
            transform: scale(1.05);
            background: #1a4a7a;
        }

        .skin-option.selected {
            border-color: #e94560;
            background: #1a4a7a;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }

        .skin-option img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            background: #0d0d0d;
            border: 2px solid #533483;
        }

        .skin-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ccc;
        }

        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .game-area.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 5px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #eee;
            flex-wrap: wrap;
            gap: 5px;
        }

        .game-header span {
            background: #0f3460;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .score {
            color: #f5c842;
        }

        canvas {
            background: #0d0d0d;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0,0,0,0.5);
            border: 3px solid #0f3460;
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1/1;
            display: block;
            margin: 0 auto;
            touch-action: none;
        }

        .game-over {
            display: none;
            background: rgba(0,0,0,0.85);
            padding: 25px 30px;
            border-radius: 20px;
            margin-top: 10px;
            border: 2px solid #e94560;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            color: #e94560;
            font-size: 2rem;
        }

        .game-over p {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .btn-restart {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-restart:hover {
            background: #ff5a7a;
            transform: scale(1.05);
        }

        .btn-back {
            background: #533483;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-back:hover {
            background: #6f4a9e;
        }

        .controls-info {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 2rem; }
            .btn { padding: 12px 25px; font-size: 1rem; min-width: 100px; }
            .btn-group { gap: 15px; }
            .game-header span { font-size: 0.9rem; padding: 5px 12px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🐍 IAGO SNAKE</h1>
        <div class="subtitle">Coma hambúrgueres e pizzas para crescer!</div>

        <!-- TELA DE MENU -->
        <div id="menuScreen" class="menu-screen">
            <div class="btn-group">
                <button class="btn btn-play" id="btnPlay">▶ JOGAR</button>
                <button class="btn btn-skins" id="btnSkins">🎨 SKINS</button>
            </div>

            <div id="skinSelector" class="skin-selector">
                <h3 style="color: #ddd; margin-bottom: 5px;">Escolha a cabeça do Iago</h3>
                <div class="skin-options">
                    <div class="skin-option selected" data-skin="normal" id="skinNormal">
                        <img src="https://i.postimg.cc/yNYxSrT8/Screenshot-2026-08-06-19-41-52-969-com-google-android-googlequicksearchbox.png" 
                             alt="Iago Normal"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E'">
                        <span class="skin-name">Iago Normal</span>
                    </div>
                    <div class="skin-option" data-skin="maquiado" id="skinMaquiado">
                        <img src="https://i.postimg.cc/6pz5wfN4/Screenshot-2026-08-06-19-42-29-829-com-google-android-googlequicksearchbox.png" 
                             alt="Iago Maquiado"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2225%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3Ccircle cx=%2275%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3C/svg%3E'">
                        <span class="skin-name">Iago Maquiado</span>
                    </div>
                </div>
                <p style="color: #aaa; font-size: 0.8rem; margin-top: 5px;">Clique na skin para selecionar</p>
            </div>
        </div>
            <!-- ÁREA DO JOGO -->
    <div id="gameArea" class="game-area">
        <div class="game-header">
            <span>🍔 <span id="scoreDisplay" class="score">0</span></span>
            <span>⏱️ <span id="timeScoreDisplay" class="score">+0</span></span>
            <span>🏆 <span id="highScoreDisplay">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button class="btn-back" id="btnBackMenu">← Voltar ao Menu</button>
        <div id="gameOver" class="game-over">
            <h2>💀 GAME OVER</h2>
            <p>Pontuação: <span id="finalScore">0</span></p>
            <p style="font-size:0.9rem; color:#bbb;">A cobrinha ficou muito gorda ou bateu em si mesma!</p>
            <button class="btn-restart" id="btnRestart">🔄 Jogar Novamente</button>
        </div>
        <div class="controls-info">⬆ ⬇ ⬅ ➡  |  Espaço = Pausar</div>
    </div>
</div>

<script>
    // ========== CONFIGURAÇÕES ==========
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const size = 20;
    const cols = 20;
    const rows = 20;

    // ========== ELEMENTOS DOM ==========
    const menuScreen = document.getElementById('menuScreen');
    const gameArea = document.getElementById('gameArea');
    const skinSelector = document.getElementById('skinSelector');
    const btnPlay = document.getElementById('btnPlay');
    const btnSkins = document.getElementById('btnSkins');
    const btnBackMenu = document.getElementById('btnBackMenu');
    const btnRestart = document.getElementById('btnRestart');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timeScoreDisplay = document.getElementById('timeScoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const finalScore = document.getElementById('finalScore');
    const gameOverDiv = document.getElementById('gameOver');
    const skinNormal = document.getElementById('skinNormal');
    const skinMaquiado = document.getElementById('skinMaquiado');

    // ========== ESTADO DO JOGO ==========
    let snake = [];
    let food = {};
    let direction = { dx: 1, dy: 0 };
    let nextDirection = { dx: 1, dy: 0 };
    let score = 0;
    let timeScore = 0;
    let highScore = 0;
    let gameRunning = false;
    let gameInterval = null;
    let timeInterval = null;
    let isPaused = false;
    let currentSkin = 'normal';
    let snakeWidth = 10;
    let moveInterval = 120;

    // ========== CARREGAR HIGH SCORE ==========
    try {
        highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
    } catch(e) {
        highScore = 0;
    }
            // ========== CARREGAR IMAGENS DAS SKINS ==========
        let headImageNormal = new Image();
        let headImageMaquiado = new Image();
        
        headImageNormal.src = 'https://i.postimg.cc/yNYxSrT8/Screenshot-2026-08-06-19-41-52-969-com-google-android-googlequicksearchbox.png';
        headImageMaquiado.src = 'https://i.postimg.cc/6pz5wfN4/Screenshot-2026-08-06-19-42-29-829-com-google-android-googlequicksearchbox.png';
        
        // Fallback para imagens (SVG)
        const fallbackNormal = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E';
        const fallbackMaquiado = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2225%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3Ccircle cx=%2275%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3C/svg%3E';

        headImageNormal.onerror = function() {
            console.warn('⚠️ Falha ao carregar Iago Normal, usando fallback');
            this.src = fallbackNormal;
        };
        headImageMaquiado.onerror = function() {
            console.warn('⚠️ Falha ao carregar Iago Maquiado, usando fallback');
            this.src = fallbackMaquiado;
        };

        // ========== FUNÇÃO PARA DESENHAR CORPO CONTÍNUO ==========
        function drawContinuousBody() {
            if (snake.length < 2) return;
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#FED2AF';
            ctx.lineWidth = snakeWidth;
            
            ctx.beginPath();
            const first = snake[0];
            ctx.moveTo(first.x * size + size/2, first.y * size + size/2);
            
            for (let i = 1; i < snake.length; i++) {
                const seg = snake[i];
                ctx.lineTo(seg.x * size + size/2, seg.y * size + size/2);
            }
            ctx.stroke();

            // Contorno
            ctx.strokeStyle = '#E8C09A';
            ctx.lineWidth = snakeWidth + 3;
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            const first2 = snake[0];
            ctx.moveTo(first2.x * size + size/2, first2.y * size + size/2);
            for (let i = 1; i < snake.length; i++) {
                const seg = snake[i];
                ctx.lineTo(seg.x * size + size/2, seg.y * size + size/2);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;

            // ===== MINI BUNDINHA =====
            if (snake.length > 3) {
                const tail = snake[snake.length - 1];
                const tailPrev = snake[snake.length - 2];
                const tx = tail.x * size + size/2;
                const ty = tail.y * size + size/2;
                const tpx = tailPrev.x * size + size/2;
                const tpy = tailPrev.y * size + size/2;
                
                const angle = Math.atan2(ty - tpy, tx - tpx);
                const bundinhaSize = snakeWidth * 0.5;
                
                ctx.fillStyle = '#FED2AF';
                ctx.strokeStyle = '#E8C09A';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.arc(tx - Math.cos(angle) * bundinhaSize * 0.3, 
                        ty - Math.sin(angle) * bundinhaSize * 0.3, 
                        bundinhaSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(tx - Math.cos(angle) * bundinhaSize * 0.6, 
                          ty - Math.sin(angle) * bundinhaSize * 0.6);
                ctx.quadraticCurveTo(
                    tx - Math.cos(angle - 0.5) * bundinhaSize * 1.2,
                    ty - Math.sin(angle - 0.5) * bundinhaSize * 1.2,
                    tx - Math.cos(angle) * bundinhaSize * 1.8,
                    ty - Math.sin(angle) * bundinhaSize * 1.8
                );
                ctx.strokeStyle = '#FED2AF';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        // ========== FUNÇÃO PARA DESENHAR CABEÇA ==========
        function drawSnakeHead(x, y) {
            const cx = x * size + size/2;
            const cy = y * size + size/2;
            const r = snakeWidth / 2 + 4;
            
            const img = currentSkin === 'maquiado' ? headImageMaquiado : headImageNormal;
            
            if (img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                try {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
                    ctx.restore();
                } catch(e) {
                    drawFallbackHead(cx, cy, r);
                }
            } else {
                drawFallbackHead(cx, cy, r);
            }
        }

        function drawFallbackHead(cx, cy, r) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#FED2AF';
            ctx.fill();
            ctx.strokeStyle = '#E8C09A';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Olhos simples
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(cx - 4 + direction.dx, cy - 3 + direction.dy, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 6 + direction.dx, cy - 3 + direction.dy, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // ========== FUNÇÕES DO JOGO ==========
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            direction = { dx: 1, dy: 0 };
            nextDirection = { dx: 1, dy: 0 };
            score = 0;
            timeScore = 0;
            snakeWidth = 10;
            gameOverDiv.classList.remove('active');
            spawnFood();
            updateScore();
            highScoreDisplay.textContent = highScore;
            gameRunning = true;
            isPaused = false;
            
            clearInterval(gameInterval);
            clearInterval(timeInterval);
            gameInterval = setInterval(gameLoop, moveInterval);
            
            timeInterval = setInterval(() => {
                if (gameRunning && !isPaused) {
                    timeScore += 1;
                    updateScore();
                }
            }, 2000);
            
            draw();
        }

        function spawnFood() {
            const foodTypes = ['🍔', '🍕'];
            const type = foodTypes[Math.floor(Math.random() * foodTypes.length)];
            let pos;
            let attempts = 0;
            do {
                pos = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
                attempts++;
            } while ((snake.some(s => s.x === pos.x && s.y === pos.y)) && attempts < 100);
            food = { ...pos, type: type };
        }

        function gameLoop() {
            if (!gameRunning || isPaused) return;
            moveSnake();
            draw();
        }

        function moveSnake() {
            direction = { ...nextDirection };
            let head = { x: snake[0].x + direction.dx, y: snake[0].y + direction.dy };

            // Wrap-around
            if (head.x < 0) head.x = cols - 1;
            if (head.x >= cols) head.x = 0;
            if (head.y < 0) head.y = rows - 1;
            if (head.y >= rows) head.y = 0;

            const ateFood = (head.x === food.x && head.y === food.y);

            snake.unshift(head);

            if (!ateFood) {
                snake.pop();
            } else {
                score += 5;
                snakeWidth = Math.min(22, snakeWidth + 1.8);
                spawnFood();
                updateScore();
            }

            const headCollision = snake.slice(1).some(s => s.x === head.x && s.y === head.y);
            if (headCollision) {
                endGame();
                return;
            }

            if (snake.length >= cols * rows) {
                endGame();
                return;
            }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            clearInterval(timeInterval);
            gameOverDiv.classList.add('active');
            const totalScore = score + timeScore;
            finalScore.textContent = totalScore;
            if (totalScore > highScore) {
                highScore = totalScore;
                try {
                    localStorage.setItem('snakeHighScore', highScore.toString());
                } catch(e) {}
                highScoreDisplay.textContent = highScore;
            }
            draw();
        }

        function updateScore() {
            const totalScore = score + timeScore;
            scoreDisplay.textContent = totalScore;
            timeScoreDisplay.textContent = `+${timeScore}`;
        }

        // ========== DESENHO ==========
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1a2a1a';
            ctx.lineWidth = 0.3;
            for (let i = 0; i <= cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * size, 0);
                ctx.lineTo(i * size, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * size);
                ctx.lineTo(canvas.width, i * size);
                ctx.stroke();
            }

            ctx.font = `${size-2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.type, food.x * size + size/2, food.y * size + size/2);

            if (snake.length > 1) {
                drawContinuousBody();
            }

            if (snake.length > 0) {
                drawSnakeHead(snake[0].x, snake[0].y);
            }

            if (!gameRunning && gameOverDiv.classList.contains('active')) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
            } else if (isPaused && gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸ PAUSADO', canvas.width/2, canvas.height/2);
            }
        }

        // ========== CONTROLES ==========
        document.addEventListener('keydown', function(e) {
            if (!gameRunning) return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                isPaused = !isPaused;
                draw();
                return;
            }

            const keyMap = {
                'ArrowUp': { dx: 0, dy: -1 },
                'ArrowDown': { dx: 0, dy: 1 },
                'ArrowLeft': { dx: -1, dy: 0 },
                'ArrowRight': { dx: 1, dy: 0 }
            };
            const newDir = keyMap[e.key];
            if (newDir) {
                e.preventDefault();
                if (direction.dx === -newDir.dx && direction.dy === -newDir.dy) return;
                nextDirection = newDir;
            }
        });

        // ========== MENU E SKINS (COM TRATAMENTO DE ERRO) ==========
        function selectSkin(skin) {
            currentSkin = skin;
            document.querySelectorAll('.skin-option').forEach(function(el) {
                el.classList.remove('selected');
            });
            if (skin === 'normal') {
                skinNormal.classList.add('selected');
            } else {
                skinMaquiado.classList.add('selected');
            }
        }

        skinNormal.addEventListener('click', function() { selectSkin('normal'); });
        skinMaquiado.addEventListener('click', function() { selectSkin('maquiado'); });

        btnSkins.addEventListener('click', function() {
            skinSelector.classList.toggle('active');
        });

        btnPlay.addEventListener('click', function() {
            try {
                skinSelector.classList.remove('active');
                menuScreen.style.display = 'none';
                gameArea.classList.add('active');
                highScoreDisplay.textContent = highScore;
                initGame();
            } catch(e) {
                console.error('Erro ao iniciar jogo:', e);
                alert('Erro ao iniciar o jogo. Tente novamente.');
            }
        });

        btnBackMenu.addEventListener('click', function() {
            gameRunning = false;
            clearInterval(gameInterval);
            clearInterval(timeInterval);
            gameArea.classList.remove('active');
            menuScreen.style.display = 'flex';
            gameOverDiv.classList.remove('active');
        });

        btnRestart.addEventListener('click', function() {
            initGame();
        });

        highScoreDisplay.textContent = highScore;

        // ========== TOQUE PARA MOBILE ==========
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!touchStartX || !touchStartY) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction.dx !== -1) nextDirection = { dx: 1, dy: 0 };
                else if (dx < 0 && direction.dx !== 1) nextDirection = { dx: -1, dy: 0 };
            } else {
                if (dy > 0 && direction.dy !== -1) nextDirection = { dx: 0, dy: 1 };
                else if (dy < 0 && direction.dy !== 1) nextDirection = { dx: 0, dy: -1 };
            }
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        canvas.addEventListener('touchend', function() {
            touchStartX = 0;
            touchStartY = 0;
        });

        console.log('🐍 Jogo da Cobrinha - Iago Snake carregado!');
        console.log('📸 Skins carregadas com sucesso!');
    </script>
</body>
</html>
