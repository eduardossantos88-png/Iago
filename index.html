<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha - Iago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }

        .container {
            background: #16213e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
            max-width: 650px;
            width: 100%;
            border: 1px solid #0f3460;
        }

        h1 {
            font-size: 2rem;
            color: #e94560;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #a8a8b3;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 #0a1a2e;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0a1a2e;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0a1a2e;
        }

        .btn-play {
            background: #e94560;
            box-shadow: 0 4px 0 #a52a3f;
        }

        .btn-play:hover {
            background: #ff5a7a;
        }

        .btn-skins {
            background: #533483;
            box-shadow: 0 4px 0 #3a1f5c;
        }

        .btn-skins:hover {
            background: #6f4a9e;
        }

        .skin-selector {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 15px;
            margin: 10px 0;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #533483;
            width: 100%;
        }

        .skin-selector.active {
            display: flex;
        }

        .skin-options {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .skin-option {
            background: #0f3460;
            border-radius: 12px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .skin-option:hover {
            transform: scale(1.05);
        }

        .skin-option.selected {
            border-color: #e94560;
            background: #1a4a7a;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }

        .skin-option img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #0d0d0d;
            border: 2px solid #533483;
        }

        .skin-name {
            font-size: 0.8rem;
            color: #ccc;
        }

        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-area.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            color: #eee;
            flex-wrap: wrap;
            gap: 5px;
        }

        .game-header span {
            background: #0f3460;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .score {
            color: #f5c842;
        }

        canvas {
            background: #0d0d0d;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 3px solid #0f3460;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1/1;
            display: block;
            margin: 0 auto;
            touch-action: none;
        }

        .game-over {
            display: none;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 15px;
            margin-top: 10px;
            border: 2px solid #e94560;
            width: 100%;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            color: #e94560;
            font-size: 1.5rem;
        }

        .game-over p {
            font-size: 1rem;
            margin: 8px 0;
        }

        .btn-restart {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .btn-restart:hover {
            background: #ff5a7a;
            transform: scale(1.05);
        }

        .btn-back {
            background: #533483;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #6f4a9e;
        }

        .controls-info {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 IAGO SNAKE</h1>
        <div class="subtitle">Coma hambúrgueres e pizzas para crescer!</div>

        <!-- MENU -->
        <div id="menuScreen" class="menu-screen">
            <div class="btn-group">
                <button class="btn btn-play" onclick="iniciarJogo()">▶ JOGAR</button>
                <button class="btn btn-skins" onclick="toggleSkins()">🎨 SKINS</button>
            </div>

            <div id="skinSelector" class="skin-selector">
                <h3 style="color: #ddd; font-size: 1rem;">Escolha a cabeça</h3>
                <div class="skin-options">
                    <div class="skin-option selected" data-skin="normal" onclick="selecionarSkin('normal')">
                        <img id="imgNormal" src="https://i.postimg.cc/yNYxSrT8/Screenshot-2026-08-06-19-41-52-969-com-google-android-googlequicksearchbox.png" 
                             alt="Normal" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E'">
                        <span class="skin-name">Normal</span>
                    </div>
                    <div class="skin-option" data-skin="maquiado" onclick="selecionarSkin('maquiado')">
                        <img id="imgMaquiado" src="https://i.postimg.cc/6pz5wfN4/Screenshot-2026-08-06-19-42-29-829-com-google-android-googlequicksearchbox.png" 
                             alt="Maquiado" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2225%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3Ccircle cx=%2275%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3C/svg%3E'">
                        <span class="skin-name">Maquiado</span>
                    </div>
                </div>
                <p style="color: #888; font-size: 0.7rem;">Clique na skin para selecionar</p>
            </div>
        </div>

        <!-- JOGO -->
        <div id="gameArea" class="game-area">
            <div class="game-header">
                <span>🍔 <span id="scoreDisplay" class="score">0</span></span>
                <span>⏱️ <span id="timeScoreDisplay" class="score">+0</span></span>
                <span>🏆 <span id="highScoreDisplay">0</span></span>
            </div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <button class="btn-back" onclick="voltarMenu()">← Voltar</button>
            <div id="gameOver" class="game-over">
                <h2>💀 GAME OVER</h2>
                <p>Pontuação: <span id="finalScore">0</span></p>
                <button class="btn-restart" onclick="reiniciarJogo()">🔄 Jogar Novamente</button>
            </div>
            <div class="controls-info">⬆ ⬇ ⬅ ➡  |  Espaço = Pausar</div>
        </div>
    </div>

    <script>
        // ===================== CONFIGURAÇÕES =====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const SIZE = 20;
        const COLS = 20;
        const ROWS = 20;
        // ===================== ELEMENTOS =====================
const menuScreen = document.getElementById('menuScreen');
const gameArea = document.getElementById('gameArea');
const skinSelector = document.getElementById('skinSelector');
const scoreDisplay = document.getElementById('scoreDisplay');
const timeScoreDisplay = document.getElementById('timeScoreDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const finalScore = document.getElementById('finalScore');
const gameOverDiv = document.getElementById('gameOver');

// ===================== ESTADO =====================
let snake = [];
let food = {};
let direction = { dx: 1, dy: 0 };
let nextDirection = { dx: 1, dy: 0 };
let score = 0;
let timeScore = 0;
let highScore = 0;
let gameRunning = false;
let gameInterval = null;
let timeInterval = null;
let isPaused = false;
let currentSkin = 'normal';
let snakeWidth = 10;

// ===================== HIGH SCORE =====================
try {
    highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
} catch(e) { highScore = 0; }
highScoreDisplay.textContent = highScore;

// ===================== IMAGENS =====================
const imgNormal = new Image();
const imgMaquiado = new Image();
imgNormal.src = 'https://i.postimg.cc/yNYxSrT8/Screenshot-2026-08-06-19-41-52-969-com-google-android-googlequicksearchbox.png';
imgMaquiado.src = 'https://i.postimg.cc/6pz5wfN4/Screenshot-2026-08-06-19-42-29-829-com-google-android-googlequicksearchbox.png';

// Fallback para imagens
const fallbackNormal = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E';
const fallbackMaquiado = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FED2AF%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2235%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Ccircle cx=%2265%22 cy=%2240%22 r=%225%22 fill=%22%23000%22/%3E%3Cpath d=%22M30 65 Q50 80 70 65%22 stroke=%22%23fff%22 stroke-width=%226%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2225%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3Ccircle cx=%2275%22 cy=%2230%22 r=%228%22 fill=%22%23ff69b4%22 opacity=%220.7%22/%3E%3C/svg%3E';

imgNormal.onerror = function() { this.src = fallbackNormal; };
imgMaquiado.onerror = function() { this.src = fallbackMaquiado; };
                // ===================== FUNÇÕES =====================
        function toggleSkins() {
            skinSelector.classList.toggle('active');
        }

        function selecionarSkin(skin) {
            currentSkin = skin;
            document.querySelectorAll('.skin-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`.skin-option[data-skin="${skin}"]`).classList.add('selected');
        }

        function iniciarJogo() {
            skinSelector.classList.remove('active');
            menuScreen.style.display = 'none';
            gameArea.classList.add('active');
            highScoreDisplay.textContent = highScore;
            initGame();
        }

        function voltarMenu() {
            gameRunning = false;
            clearInterval(gameInterval);
            clearInterval(timeInterval);
            gameArea.classList.remove('active');
            menuScreen.style.display = 'flex';
            gameOverDiv.classList.remove('active');
        }

        function reiniciarJogo() {
            initGame();
        }

        // ===================== JOGO =====================
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            direction = { dx: 1, dy: 0 };
            nextDirection = { dx: 1, dy: 0 };
            score = 0;
            timeScore = 0;
            snakeWidth = 10;
            gameOverDiv.classList.remove('active');
            spawnFood();
            updateScore();
            gameRunning = true;
            isPaused = false;
            
            clearInterval(gameInterval);
            clearInterval(timeInterval);
            gameInterval = setInterval(gameLoop, 120);
            
            timeInterval = setInterval(() => {
                if (gameRunning && !isPaused) {
                    timeScore += 1;
                    updateScore();
                }
            }, 2000);
            
            draw();
        }

        function spawnFood() {
            const foodTypes = ['🍔', '🍕'];
            const type = foodTypes[Math.floor(Math.random() * foodTypes.length)];
            let pos;
            let attempts = 0;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
                attempts++;
            } while ((snake.some(s => s.x === pos.x && s.y === pos.y)) && attempts < 100);
            food = { ...pos, type: type };
        }

        function gameLoop() {
            if (!gameRunning || isPaused) return;
            moveSnake();
            draw();
        }

        function moveSnake() {
            direction = { ...nextDirection };
            let head = { x: snake[0].x + direction.dx, y: snake[0].y + direction.dy };

            // Wrap-around
            if (head.x < 0) head.x = COLS - 1;
            if (head.x >= COLS) head.x = 0;
            if (head.y < 0) head.y = ROWS - 1;
            if (head.y >= ROWS) head.y = 0;

            const ateFood = (head.x === food.x && head.y === food.y);

            snake.unshift(head);

            if (!ateFood) {
                snake.pop();
            } else {
                score += 5;
                snakeWidth = Math.min(22, snakeWidth + 1.8);
                spawnFood();
                updateScore();
            }

            const headCollision = snake.slice(1).some(s => s.x === head.x && s.y === head.y);
            if (headCollision) {
                endGame();
                return;
            }

            if (snake.length >= COLS * ROWS) {
                endGame();
                return;
            }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            clearInterval(timeInterval);
            gameOverDiv.classList.add('active');
            const totalScore = score + timeScore;
            finalScore.textContent = totalScore;
            if (totalScore > highScore) {
                highScore = totalScore;
                try { localStorage.setItem('snakeHighScore', highScore.toString()); } catch(e) {}
                highScoreDisplay.textContent = highScore;
            }
            draw();
        }

        function updateScore() {
            const totalScore = score + timeScore;
            scoreDisplay.textContent = totalScore;
            timeScoreDisplay.textContent = `+${timeScore}`;
        }

        // ===================== DESENHO =====================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#1a2a1a';
            ctx.lineWidth = 0.3;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * SIZE, 0);
                ctx.lineTo(i * SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * SIZE);
                ctx.lineTo(canvas.width, i * SIZE);
                ctx.stroke();
            }

            // Comida
            ctx.font = `${SIZE-2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.type, food.x * SIZE + SIZE/2, food.y * SIZE + SIZE/2);

            // Corpo
            if (snake.length > 1) {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#FED2AF';
                ctx.lineWidth = snakeWidth;
                ctx.beginPath();
                ctx.moveTo(snake[0].x * SIZE + SIZE/2, snake[0].y * SIZE + SIZE/2);
                for (let i = 1; i < snake.length; i++) {
                    ctx.lineTo(snake[i].x * SIZE + SIZE/2, snake[i].y * SIZE + SIZE/2);
                }
                ctx.stroke();

                // Bundinha
                if (snake.length > 3) {
                    const tail = snake[snake.length - 1];
                    const tailPrev = snake[snake.length - 2];
                    const tx = tail.x * SIZE + SIZE/2;
                    const ty = tail.y * SIZE + SIZE/2;
                    const tpx = tailPrev.x * SIZE + SIZE/2;
                    const tpy = tailPrev.y * SIZE + SIZE/2;
                    const angle = Math.atan2(ty - tpy, tx - tpx);
                    const bSize = snakeWidth * 0.5;
                    
                    ctx.fillStyle = '#FED2AF';
                    ctx.strokeStyle = '#E8C09A';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(tx - Math.cos(angle) * bSize * 0.3, ty - Math.sin(angle) * bSize * 0.3, bSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(tx - Math.cos(angle) * bSize * 0.6, ty - Math.sin(angle) * bSize * 0.6);
                    ctx.quadraticCurveTo(tx - Math.cos(angle - 0.5) * bSize * 1.2, ty - Math.sin(angle - 0.5) * bSize * 1.2, tx - Math.cos(angle) * bSize * 1.8, ty - Math.sin(angle) * bSize * 1.8);
                    ctx.strokeStyle = '#FED2AF';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }

            // Cabeça
            if (snake.length > 0) {
                const cx = snake[0].x * SIZE + SIZE/2;
                const cy = snake[0].y * SIZE + SIZE/2;
                const r = snakeWidth / 2 + 4;
                const img = currentSkin === 'maquiado' ? imgMaquiado : imgNormal;
                
                if (img.complete && img.naturalWidth > 0) {
                    try {
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.clip();
                        ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
                        ctx.restore();
                    } catch(e) {
                        drawFallbackHead(cx, cy, r);
                    }
                } else {
                    drawFallbackHead(cx, cy, r);
                }
            }

            // Mensagens
            if (!gameRunning && gameOverDiv.classList.contains('active')) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
            } else if (isPaused && gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸ PAUSADO', canvas.width/2, canvas.height/2);
            }
        }

        function drawFallbackHead(cx, cy, r) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#FED2AF';
            ctx.fill();
            ctx.strokeStyle = '#E8C09A';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(cx - 4 + direction.dx, cy - 3 + direction.dy, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 6 + direction.dx, cy - 3 + direction.dy, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // ===================== CONTROLES TECLADO =====================
        document.addEventListener('keydown', function(e) {
            if (!gameRunning) return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                isPaused = !isPaused;
                draw();
                return;
            }
            const keyMap = {
                'ArrowUp': { dx: 0, dy: -1 },
                'ArrowDown': { dx: 0, dy: 1 },
                'ArrowLeft': { dx: -1, dy: 0 },
                'ArrowRight': { dx: 1, dy: 0 }
            };
            const newDir = keyMap[e.key];
            if (newDir) {
                e.preventDefault();
                if (direction.dx === -newDir.dx && direction.dy === -newDir.dy) return;
                nextDirection = newDir;
            }
        });

        // ===================== TOQUE MOBILE =====================
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!touchStartX || !touchStartY) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction.dx !== -1) nextDirection = { dx: 1, dy: 0 };
                else if (dx < 0 && direction.dx !== 1) nextDirection = { dx: -1, dy: 0 };
            } else {
                if (dy > 0 && direction.dy !== -1) nextDirection = { dx: 0, dy: 1 };
                else if (dy < 0 && direction.dy !== 1) nextDirection = { dx: 0, dy: -1 };
            }
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        canvas.addEventListener('touchend', function() {
            touchStartX = 0;
            touchStartY = 0;
        });

        console.log('🐍 Jogo da Cobrinha carregado!');
    </script>
</body>
</html>
